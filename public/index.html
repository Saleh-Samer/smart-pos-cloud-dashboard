<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2D3648" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Smart POS" />
<title>Smart POS</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icon-512.png" />
<link rel="apple-touch-icon" href="icon-512.png" />
<link rel="stylesheet" href="css/style.css?v=9" />
</head>
<body data-title="app_title">

<div id="loginScreen" class="auth-wrap" hidden>
  <div class="auth-card">
    <div id="loginLogo"></div>
    <h1 data-t="app_title">متابعة المبيعات</h1>
    <p class="sub" data-t="manager_sub"></p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="shopCode" data-t="shop_code"></label>
        <input id="shopCode" class="code-input ltr" autocomplete="username" autocapitalize="characters" spellcheck="false" data-t-ph="shop_code_ph" />
      </div>
      <div class="field">
        <label for="password" data-t="password"></label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <p class="form-error" id="loginError" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn" data-t="sign_in"></button>
    </form>
    <div class="auth-foot"><button class="btn btn-outline btn-sm langBtn" type="button" data-t="lang_toggle"></button></div>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <span id="topLogo"></span>
    <span class="topbar-title" id="shopName"></span>
    <div class="topbar-actions">
      <button class="btn btn-ghost-light btn-sm langBtn" type="button" data-t="lang_toggle"></button>
      <button class="btn btn-ghost-light btn-sm" type="button" id="passwordBtn" data-t="change_password"></button>
      <button class="btn btn-ghost-light btn-sm" type="button" id="logoutBtn" data-t="sign_out"></button>
    </div>
  </header>

  <main class="page">
    <div class="daybar">
      <select id="daySelect" aria-label="day"></select>
      <button class="btn btn-outline btn-sm" type="button" id="refreshBtn" data-t="refresh"></button>
      <span class="updated" id="updatedText"></span>
    </div>

    <div id="notice" class="notice" hidden></div>

    <section id="emptyState" class="card empty-state" hidden>
      <h2 id="emptyTitle"></h2>
      <p class="muted" id="emptySub"></p>
    </section>

    <div id="dataArea" hidden>
      <div id="printHeader" class="print-only">
        <div class="ph-brand">SMART POS</div>
        <h1 id="phShop"></h1>
        <div id="phLine"></div>
        <div id="phStatus"></div>
      </div>
      <div id="dayStatus" class="notice" hidden></div>
      <section class="stats">
        <div class="stat"><div class="stat-label" data-t="revenue"></div><span class="stat-value" id="statRevenue"></span></div>
        <div class="stat"><div class="stat-label" data-t="orders"></div><span class="stat-value" id="statOrders"></span></div>
        <div class="stat"><div class="stat-label" data-t="profit"></div><span class="stat-value" id="statProfit"></span></div>
        <div class="stat highlight"><div class="stat-label" id="statCashLabel" data-t="expected_cash"></div><span class="stat-value" id="statCash"></span><div class="stat-sub" id="statCashSub"></div></div>
      </section>

      <div class="grid-2">
        <section class="card" id="shiftsCard" hidden><h2><span data-t="shifts"></span><span class="count" id="shiftsCount"></span></h2><div id="shiftsSummary"></div><ul class="list" id="shiftsList"></ul></section>
        <section class="card" id="reviewsCard" hidden><h2><span data-t="count_reviews"></span><span class="count" id="reviewsCount"></span></h2><ul class="list" id="reviewsList"></ul></section>
        <section class="card" id="correctionsCard" hidden><h2><span data-t="pay_corrections"></span><span class="count" id="correctionsCount"></span></h2><ul class="list" id="correctionsList"></ul></section>
        <section class="card" id="drawerCard" hidden><h2><span data-t="drawer_openings"></span><span class="count" id="drawerCount"></span></h2><ul class="list" id="drawerList"></ul></section>
        <section class="card" id="notesCard" hidden><h2><span data-t="cashier_notes"></span><span class="count" id="notesCount"></span></h2><ul class="list" id="notesList"></ul></section>
        <section class="card"><h2><span data-t="by_payment"></span></h2><div id="paymentList"></div></section>
        <section class="card" id="stockWeekCard" hidden><h2><span data-t="stock_week"></span></h2><div id="stockWeekTotals"></div><ul class="list" id="stockWeekList"></ul><p class="empty-line" id="stockWeekIdle"></p></section>
        <section class="card" id="wasteCard" hidden><h2><span data-t="waste_title"></span><span class="count" id="wasteCount"></span></h2><ul class="list" id="wasteList"></ul></section>
        <section class="card" id="receivedCard" hidden><h2><span data-t="received_title"></span><span class="count" id="receivedCount"></span></h2><ul class="list" id="receivedList"></ul></section>
        <section class="card"><h2><span data-t="top_products"></span></h2><ul class="list" id="topList"></ul></section>
        <section class="card"><h2><span data-t="expenses"></span><span class="count ltr" id="expensesTotal"></span></h2><ul class="list" id="expensesList"></ul></section>
        <section class="card"><h2><span data-t="deleted_invoices"></span><span class="count" id="deletedCount"></span></h2><ul class="list" id="deletedList"></ul></section>
        <section class="card"><h2><span data-t="discounts"></span><span class="count" id="discountCount"></span></h2><ul class="list" id="discountList"></ul></section>
        <section class="card"><h2><span data-t="table_changes"></span><span class="count" id="tableCount"></span></h2><ul class="list" id="tableList"></ul></section>
        <section class="card" id="lowStockCard"><h2><span data-t="low_stock"></span><span class="count" id="lowStockCount"></span></h2><ul class="list" id="lowStockList"></ul></section>
      </div>
      <div class="pdf-wrap"><button class="btn btn-primary" type="button" id="pdfBtn" data-t="save_pdf"></button></div>
    </div>
  </main>
</div>

<script src="js/common.js?v=12"></script>
<script src="js/dashboard.js?v=12"></script>
</body>
</html>
